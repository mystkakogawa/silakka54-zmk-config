# Silakka54 Mac + JIS 向け設定

# キーボード表示名（Bluetooth一覧に出る名前）
CONFIG_ZMK_KEYBOARD_NAME="Silakka54"

# 無線出力強化
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# デバウンス
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# Macで LANG1/LANG2（かな/英数）を確実に通すため HKRO（6キー）を明示
# ※ NKRO だと Mac で Language キーが欠けることがある
CONFIG_ZMK_HID_REPORT_TYPE_HKRO=y

# nice!view 表示
CONFIG_ZMK_DISPLAY=y

# 左右バッテリーをホストへ（左マスター時のみ有効。右ビルドでは警告のみで無視される）
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# ZMK Studio（USB接続時のリアルタイム編集）
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# ディープスリープ（電池節約。不要ならコメントアウト）
CONFIG_ZMK_SLEEP=y

# USBログ（消費電力増のため通常はオフ）
# CONFIG_ZMK_USB_LOGGING=y
